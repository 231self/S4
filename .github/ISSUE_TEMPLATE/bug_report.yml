name: Bug report
description: Report a problem with Maskura
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Security vulnerability? Use [Maskura private vulnerability
        reporting](https://github.com/231self/S4/security/advisories/new), not
        this public form.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Commands, payloads, and configuration needed to reproduce.
      placeholder: |
        maskura local init
        maskura put ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag or commit hash, plus gateway log lines if relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: OS, Rust toolchain, Docker (if used), storage backend.
