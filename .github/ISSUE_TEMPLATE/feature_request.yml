name: Feature request
description: Suggest an enhancement for S4
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Keep it concrete.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gateway / S3 API
        - Wasm filters / pipeline
        - Encryption
        - Storage backends
        - CLI (s4ctl)
        - SDKs
        - Docs
        - Other
