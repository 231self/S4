name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: 2
  IMAGE: ghcr.io/${{ github.repository_owner }}/s4/s4

jobs:
  # Native per-arch builds: amd64 on the x64 runner, arm64 on the native
  # arm64 runner. No cross-compilation, so ring/aws-lc-sys/openssl-sys build
  # against each runner's own native libs. Both legs run in parallel.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-tools + build filters
        run: |
          cargo install --locked wasm-tools --version 1.255.0
          bash scripts/build-filters.sh

      - name: Test workspace
        run: cargo test --workspace

      - name: Build gateway and MCP releases (${{ matrix.suffix }})
        run: |
          mkdir -p dist/components
          cargo build --release -p s4-gateway -p s4-mcp
          cp target/release/s4-gateway dist/s4-gateway
          cp target/release/s4-mcp dist/s4-mcp-linux-${{ matrix.suffix }}
          cp -r target/components/. dist/components/

      - name: Upload MCP binary (${{ matrix.suffix }})
        uses: actions/upload-artifact@v4
        with:
          name: s4-mcp-${{ matrix.suffix }}
          path: dist/s4-mcp-linux-${{ matrix.suffix }}
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Assembly-only build (seconds): COPYs the runner-built artifacts.
      - name: Build image (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}

      - name: Boot-smoke image (${{ matrix.suffix }})
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}
        run: bash scripts/release-image-smoke.sh "$IMAGE_REF"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (${{ matrix.suffix }})
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}
        run: docker push "$IMAGE_REF"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download MCP binaries
        uses: actions/download-artifact@v4
        with:
          pattern: s4-mcp-*
          path: dist
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Merge multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.ref_name }}-amd64 \
            ${{ env.IMAGE }}:${{ github.ref_name }}-arm64

      - name: Extract release artifacts from image
        run: |
          mkdir -p dist/filters
          docker create --name s4-extract --platform linux/amd64 "${{ env.IMAGE }}:${{ github.ref_name }}-amd64"
          docker cp s4-extract:/usr/local/bin/s4-gateway dist/s4-gateway-linux-x86_64
          docker cp s4-extract:/app/components/. dist/filters/
          docker rm s4-extract
          tar -czf dist/s4-filters.tar.gz -C dist filters
          tar -czf dist/s4-python-sdk.tar.gz -C sdks python
          tar -czf dist/s4-typescript-sdk.tar.gz -C sdks typescript

      - name: Make image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "/repos/${{ github.repository }}/packages/container/s4" \
            -f visibility=public \
            || echo "warning: could not set image visibility to public"

      - name: Prune old image versions (keep latest + last 3 tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep=3
          gh api --paginate "/repos/${{ github.repository }}/packages/container/s4/versions?per_page=100" \
            --jq '[.[] | select((.metadata.container.tags | length) > 0)
                   | {id, created: .created_at, tag: .metadata.container.tags[0]}]
                  | sort_by(.created) | reverse' \
            | jq -c '.[]' \
            | tail -n +$((keep + 2)) \
            | while read -r v; do
                id=$(echo "$v" | jq -r .id)
                tag=$(echo "$v" | jq -r .tag)
                echo "pruning image version $tag ($id)"
                gh api -X DELETE "/repos/${{ github.repository }}/packages/container/s4/versions/$id" \
                  || echo "warning: could not delete $tag"
              done
          echo "prune done (kept latest + $keep tags)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
             dist/s4-gateway-linux-x86_64 \
             dist/s4-mcp-linux-amd64 \
             dist/s4-mcp-linux-arm64 \
             dist/s4-filters.tar.gz \
            dist/s4-python-sdk.tar.gz \
            dist/s4-typescript-sdk.tar.gz \
            --repo "${{ github.repository }}" \
            --generate-notes
