name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: 2
  IMAGE: ghcr.io/${{ github.repository_owner }}/maskura/maskura
  LEGACY_IMAGE: ghcr.io/${{ github.repository_owner }}/s4/s4

jobs:
  # Native per-arch builds: amd64 on the x64 runner, arm64 on the native
  # arm64 runner. No cross-compilation, so ring/aws-lc-sys/openssl-sys build
  # against each runner's own native libs. Both legs run in parallel.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-tools + build filters
        run: |
          cargo install --locked wasm-tools --version 1.255.0
          bash scripts/build-filters.sh

      - name: Test workspace
        run: cargo test --workspace

      - name: Build gateway, CLI, and MCP releases (${{ matrix.suffix }})
        run: |
          mkdir -p dist/components
          cargo build --release -p s4-gateway -p s4-mcp -p s4ctl
          cp target/release/s4-gateway dist/s4-gateway
          cp target/release/maskura-mcp dist/maskura-mcp-linux-${{ matrix.suffix }}
          cp target/release/s4-mcp dist/s4-mcp-linux-${{ matrix.suffix }}
          cp target/release/maskura dist/maskura-linux-${{ matrix.suffix }}
          cp target/release/s4ctl dist/s4ctl-linux-${{ matrix.suffix }}
          cp -r target/components/. dist/components/

      - name: Upload CLI and MCP binaries (${{ matrix.suffix }})
        uses: actions/upload-artifact@v4
        with:
          name: maskura-binaries-${{ matrix.suffix }}
          path: |
            dist/maskura-mcp-linux-${{ matrix.suffix }}
            dist/s4-mcp-linux-${{ matrix.suffix }}
            dist/maskura-linux-${{ matrix.suffix }}
            dist/s4ctl-linux-${{ matrix.suffix }}
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Assembly-only build (seconds): COPYs the runner-built artifacts.
      - name: Build image (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}
            ${{ env.LEGACY_IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}

      - name: Boot-smoke image (${{ matrix.suffix }})
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}
        run: bash scripts/release-image-smoke.sh "$IMAGE_REF"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (${{ matrix.suffix }})
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}
          LEGACY_IMAGE_REF: ${{ env.LEGACY_IMAGE }}:${{ github.ref_name }}-${{ matrix.suffix }}
        run: |
          docker push "$IMAGE_REF"
          docker push "$LEGACY_IMAGE_REF"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI and MCP binaries
        uses: actions/download-artifact@v4
        with:
          pattern: maskura-binaries-*
          path: dist
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.LEGACY_IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.LEGACY_IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.ref_name }}-amd64 \
            ${{ env.IMAGE }}:${{ github.ref_name }}-arm64

      - name: Extract release artifacts from image
        run: |
          mkdir -p dist/filters
          docker create --name maskura-extract --platform linux/amd64 "${{ env.IMAGE }}:${{ github.ref_name }}-amd64"
          docker cp maskura-extract:/usr/local/bin/s4-gateway dist/maskura-gateway-linux-x86_64
          cp dist/maskura-gateway-linux-x86_64 dist/s4-gateway-linux-x86_64
          docker cp maskura-extract:/app/components/. dist/filters/
          docker rm maskura-extract
          tar -czf dist/maskura-filters.tar.gz -C dist filters
          tar -czf dist/s4-filters.tar.gz -C dist filters
          npm install --prefix sdks/typescript --no-package-lock
          npm run --prefix sdks/typescript build
          python3 sdks/package-release.py --output-dir dist

      - name: Make canonical and legacy images public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "/orgs/${{ github.repository_owner }}/packages/container/maskura%2Fmaskura" \
            -f visibility=public
          gh api -X PATCH "/orgs/${{ github.repository_owner }}/packages/container/s4%2Fs4" \
            -f visibility=public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
             dist/maskura-gateway-linux-x86_64 \
             dist/s4-gateway-linux-x86_64 \
             dist/maskura-mcp-linux-amd64 \
             dist/maskura-mcp-linux-arm64 \
             dist/s4-mcp-linux-amd64 \
             dist/s4-mcp-linux-arm64 \
             dist/maskura-linux-amd64 \
             dist/maskura-linux-arm64 \
             dist/s4ctl-linux-amd64 \
             dist/s4ctl-linux-arm64 \
             dist/maskura-filters.tar.gz \
             dist/s4-filters.tar.gz \
             dist/maskura-python-sdk.tar.gz \
             dist/s4-python-sdk.tar.gz \
             dist/maskura-typescript-sdk.tar.gz \
             dist/s4-typescript-sdk.tar.gz \
             --repo "${{ github.repository }}" \
            --generate-notes
