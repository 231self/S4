[workspace]
resolver = "2"
members = [
  "crates/customer-config",
  "crates/error",
  "crates/policy",
  "crates/wasm-runtime",
  "crates/gateway",
  "crates/s4-mcp",
  "crates/s4ctl",
  "filters/pii-default",
  "filters/pii-shared",
  "filters/noop",
  "filters/email-detect",
  "filters/ssn-detect",
  "filters/card-detect",
  "filters/envelope-encrypt",
  "filters/stable-encrypt",
  "filters/test-filter",
  "filters/test-filter-v02",
  "filters/test-binary-reductor",
]

[workspace.package]
version = "0.3.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/231self/S4"

[workspace.dependencies]
maskura-customer-config = { path = "crates/customer-config" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"
uuid = { version = "1", features = ["v7", "v5", "v4"] }
rand = "0.8"
zeroize = "1"
bytes = "1"
csv-core = "0.1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"

ciborium = "0.2"
ed25519-dalek = "3"

wasmtime = "47"
wasmtime-wasi = "47"
wit-bindgen = "0.60"

addr-spec = "0.9"
card-validate = "2"

proptest = "1"

axum = "0.8"
tokio = { version = "1", features = ["full"] }
aws-sdk-s3 = "1"
aws-config = "1"
aws-sigv4 = "1.5"
aws-credential-types = "1.3"
aws-smithy-http-client = { version = "1.3", default-features = false, features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = "1.14"
aws-smithy-types = "1.6"
md-5 = "0.10"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "stream"] }
psl = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid"] }
async-trait = "0.1"

utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
codegen-units = 1
