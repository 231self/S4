[workspace]
resolver = "2"
members = [
  "crates/error",
  "crates/policy",
  "crates/wasm-runtime",
  "crates/gateway",
  "crates/s4ctl",
  "filters/pii-default",
  "filters/pii-shared",
  "filters/noop",
  "filters/email-detect",
  "filters/ssn-detect",
  "filters/card-detect",
  "filters/envelope-encrypt",
  "filters/stable-encrypt",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/231self/s4"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"
uuid = { version = "1", features = ["v7", "v4"] }
rand = "0.8"

ciborium = "0.2"
ed25519-dalek = "3"

wasmtime = "47"
wit-bindgen = "0.60"

addr-spec = "0.9"
card-validate = "2"

proptest = "1"

axum = "0.8"
tokio = { version = "1", features = ["full"] }
aws-sdk-s3 = "1"
aws-config = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid"] }
async-trait = "0.1"

utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
codegen-units = 1
