[package]
name = "s4-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local stdio MCP server for the Maskura object-processing gateway"
publish = false

[[bin]]
name = "s4-mcp"
path = "src/main.rs"

[[bin]]
name = "maskura-mcp"
path = "src/maskura_mcp.rs"

[dependencies]
maskura-customer-config.workspace = true
anyhow = "1"
futures-util = "0.3"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

[dev-dependencies]
axum.workspace = true
http-body-util = "0.1"
s4-gateway = { path = "../gateway" }
uuid.workspace = true
