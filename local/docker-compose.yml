services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 5
    volumes:
      - minio-data:/data

  gateway:
    build:
      context: ..
      dockerfile: local/Dockerfile
    ports:
      - "8080:8080"
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      LISTEN_ADDR: 0.0.0.0:8080
      MASKURA_FILTER_COMPONENT: /app/pii-default.component.wasm
      AUTH_DISABLED: "true"
      MASKURA_KEYS_FILE: /app/data/keys.json
    volumes:
      - s4-keys:/app/data
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
  s4-keys:
